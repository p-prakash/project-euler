name: Trigger auto deployment for test-wus2-capp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/test-wus2-capp-AutoDeployTrigger-e5dc8450-386d-44be-a1ed-c5c52b744509.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TESTWUS2CAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TESTWUS2CAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TESTWUS2CAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.TESTWUS2CAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TESTWUS2CAPP_REGISTRY_PASSWORD }}
          containerAppName: test-wus2-capp
          resourceGroup: Sandbox-RG
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


